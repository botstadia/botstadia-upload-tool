[package]
name = "botstadia-chain"
description = "BotStadia's chain SDK: contract bindings, session specs, the hourly post's Merkle tree, entry encodings, SubmitKey signing and event decoding. Shared by the api, the keeper, the alert Worker, the runner and the CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# JSON-RPC over HTTP for native callers (the runner, the CLI, the outside check).
native = ["dep:reqwest"]
# JSON-RPC over the Workers runtime's fetch (the api, the keeper, the alert Worker).
worker = ["dep:worker"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
k256 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true }
worker = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true }
sha2 = { workspace = true }
# A software passkey for the wallet proof and tests.
p256 = { version = "0.13.2", features = ["ecdsa"] }

[[example]]
name = "send"
required-features = ["native"]

[[example]]
name = "sign"
required-features = ["native"]

[[example]]
name = "bettor"
required-features = ["native"]

[[example]]
name = "wallet"
required-features = ["native"]

[[example]]
name = "base_facts"
required-features = ["native"]

[lints]
workspace = true

# k256 reaches getrandom 0.2 through rand_core; in Workers it draws from
# crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
