# The standalone tool's release binaries, built here from this repository's
# own source, each with GitHub's build provenance attestation naming the
# commit (TRUST.md#bundle-encryption). Runs on a version tag (vX.Y.Z), which
# BotStadia's export pushes, or by hand for an existing tag.
#
# Linux builds run in manylinux 2.28 (glibc 2.28), so they run on any current
# distribution and under WSL; each is run on Ubuntu 22.04 and Debian 12 first.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: quay.io/pypa/manylinux_2_28_aarch64@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
      - name: Build (macOS)
        if: matrix.manylinux == ''
        run: |
          rustup toolchain install
          cargo build --release --locked -p botstadia-upload --features tool
      - name: Build (Linux, glibc 2.28)
        if: matrix.manylinux != ''
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e CARGO_HOME=/w/.cargo-home -e RUSTUP_HOME=/w/.rustup-home \
            "${{ matrix.manylinux }}" sh -ec '
              curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
              . /w/.cargo-home/env
              rustup toolchain install
              cargo build --release --locked -p botstadia-upload --features tool
            '
      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p out/botstadia-upload
          cp target/release/botstadia-upload out/botstadia-upload/
          cp LICENSE-MIT LICENSE-APACHE README.md out/botstadia-upload/
          tar -C out -czf "botstadia-upload-${{ matrix.target }}.tar.gz" botstadia-upload
          out/botstadia-upload/botstadia-upload --version
      - name: Older distributions
        if: matrix.manylinux != ''
        run: |
          for image in ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8; do
            docker run --rm -v "$PWD/out:/o" "$image" /o/botstadia-upload/botstadia-upload --version
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: botstadia-upload-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botstadia-upload-${{ matrix.target }}
          path: botstadia-upload-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and the installer
        run: |
          set -e
          cd dist
          sha256sum botstadia-upload-*.tar.gz > SHA256SUMS
          sum() { grep " botstadia-upload-$1.tar.gz\$" SHA256SUMS | cut -d' ' -f1; }
          cat > install.sh <<SH
          #!/bin/sh
          # Installs botstadia-upload $TAG, BotStadia's standalone upload tool,
          # from github.com/${{ github.repository }}, checking each download
          # against the checksum below.
          set -eu
          case "\$(uname -s)-\$(uname -m)" in
            Darwin-arm64) target=aarch64-apple-darwin; want=$(sum aarch64-apple-darwin) ;;
            Linux-x86_64) target=x86_64-unknown-linux-gnu; want=$(sum x86_64-unknown-linux-gnu) ;;
            Linux-aarch64|Linux-arm64) target=aarch64-unknown-linux-gnu; want=$(sum aarch64-unknown-linux-gnu) ;;
            *) echo "botstadia-upload: no build for \$(uname -s) \$(uname -m); build it from source (README)" >&2; exit 1 ;;
          esac
          dir="\${BOTSTADIA_UPLOAD_DIR:-\$HOME/.local/bin}"
          work=\$(mktemp -d); trap 'rm -rf "\$work"' EXIT
          curl -fsSL -o "\$work/t.tgz" "https://github.com/${{ github.repository }}/releases/download/$TAG/botstadia-upload-\$target.tar.gz"
          got=\$( (sha256sum "\$work/t.tgz" 2>/dev/null || shasum -a 256 "\$work/t.tgz") | cut -d' ' -f1)
          [ "\$got" = "\$want" ] || { echo "botstadia-upload: checksum mismatch (\$got)" >&2; exit 1; }
          tar -xzf "\$work/t.tgz" -C "\$work"
          mkdir -p "\$dir"
          install -m 0755 "\$work/botstadia-upload/botstadia-upload" "\$dir/botstadia-upload"
          echo "botstadia-upload $TAG installed in \$dir"
          case ":\$PATH:" in *":\$dir:"*) ;; *) echo "add \$dir to your PATH" ;; esac
          SH
          sh -n install.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag \
            --title "botstadia-upload $TAG" \
            --notes "Built by this repository's release workflow from $TAG, each archive with GitHub's build provenance attestation. Install: curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh" \
            dist/*.tar.gz dist/SHA256SUMS dist/install.sh
