# One workspace for every crate, whatever it targets:
# - native:                  the session host, the CLI, botstadia-train
# - wasm32-unknown-unknown:  api and www workers (worker-build), site (trunk)
# - wasm32-wasip2:           the policy shell component
# The target is chosen per command (see Taskfile.yml), never per crate.
#
# Workspace deps are pull-don't-push: a dependency enters
# [workspace.dependencies] only when a crate here actually needs it.
[workspace]
resolver = "3"
members = [
    "packages/shared",
    "packages/chain",
    "packages/attestation/core",
    "packages/upload",
]
# The zkVM guest builds in a workspace of its own (see its methods crate).
exclude = ["packages/attestation/methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Local crates
botstadia-shared = { path = "packages/shared" }
# Shared with the arenas and the tools: declarations, metrics, player messages.
botstadia-interface = "0.2.0"
botstadia-host = { path = "packages/host" }
botstadia-rating = { path = "packages/rating" }
botstadia-standings = { path = "packages/standings" }
botstadia-week-clock = { path = "packages/week-clock" }
botstadia-seating = { path = "packages/seating" }
botstadia-chain = { path = "packages/chain" }
botstadia-backend = { path = "packages/backend/core" }
botstadia-upload = { path = "packages/upload" }

# Week times in Israel time (DST-aware) from config.yml, with the time-zone
# database bundled so Workers (no system tzdb) and every machine agree.
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }

# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Cloudflare Workers (api)
worker = { version = "0.8.7", features = ["d1"] }

# Auth (api): HMAC-signed tokens, Argon2id passwords, secure randomness.
# Pure Rust, so the same code runs in the worker and under `cargo test`.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hmac = "0.12.1"
sha2 = "0.10.9"
urlencoding = "2.1.3"

# Frontend (wasm32-unknown-unknown via Trunk).
# The wasm-bindgen family moves together: Trunk and worker-build fetch the
# wasm-bindgen CLI matching the version in Cargo.lock.
dominator = "0.5.38"
futures-signals = "0.3.34"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1.7"

# The session host, the CLI and botstadia-train (native), the policy shell (wasip2)
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive", "env"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "api-23"] }
# Exact: Wasmtime is part of the budget version (BOTS.md#budget-versions), so
# a `cargo update` must never move it. `budget::pin` checks the lockfile.
wasmtime = "=50.0.1"
wasmtime-wasi = "=50.0.1"
wit-bindgen = "0.63.0"

# The chain SDK (native and wasm32-unknown-unknown). Only the pieces with no
# networking or runtime of their own, so they build for Workers; JSON-RPC goes
# through the SDK's own transport trait.
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde", "k256"] }
alloy-sol-types = { version = "1.7.3", features = ["json"] }
alloy-consensus = { version = "2.5.0", default-features = false, features = ["std", "k256"] }
alloy-eips = { version = "2.5.0", default-features = false, features = ["std"] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
# Set by the enclave image build: mock attestation refuses to compile in it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(botstadia_image)", "cfg(botstadia_testnet)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# The site's and the admin site's wasm only (Trunk builds them with it,
# `data-cargo-profile-release` in each index.html; `trunk serve` keeps dev): about 30% smaller after wasm-opt
# than `release`, for a slower release build. Native release builds (the
# host, the CLI, the enclave image) never use it: their bytes are fixed for
# reproducible builds.
[profile.frontend]
inherits = "release"
codegen-units = 1
opt-level = "s"

# Mock attestation tokens sign and verify with RSA; unoptimised, a test
# spends tens of seconds there.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rand_chacha]
opt-level = 3
